<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks | Thread Futures</title>
<meta name="description" content="Thanks for getting in touch with Thread Futures.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#173D35">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23173D35'/%3E%3Ctext x='16' y='25' text-anchor='middle' font-family='Georgia,Times New Roman,serif' font-style='italic' font-size='28' fill='%23D7EF91'%3Et%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--forest:#173D35;--forest-2:#1F4D43;--deep:#0F2A23;--lime:#D7EF91;--lime-2:#E6F6B8;--text:#F7F7F1;--muted:#BFD0C9;--hair:rgba(255,255,255,.13);--serif:'Instrument Serif',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--forest);color:var(--text);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px;width:100%}
.nav-in{display:flex;align-items:center;height:68px}
.logo{display:inline-block;line-height:44px;font-weight:800;font-size:1.2rem;letter-spacing:-.025em;text-decoration:none;white-space:nowrap}
.logo .b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.22em;color:var(--lime);margin-left:.2em}
main{flex:1;display:flex;align-items:center;padding:64px 0 96px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:.76rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:currentColor}
h1{font-weight:800;letter-spacing:-.03em;line-height:1.04;font-size:clamp(2.4rem,5vw,4rem);margin:18px 0 20px;max-width:12em}
h1 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--lime)}
p{color:var(--muted);font-size:1.12rem;max-width:32em}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;font-weight:800;font-size:.98rem;padding:12px 22px;border-radius:999px;text-decoration:none}
.btn-lime{background:var(--lime);color:var(--forest)}
.btn-lime:hover{background:var(--lime-2)}
.btn-ghost{color:var(--text);box-shadow:inset 0 0 0 1.5px rgba(247,247,241,.45)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--text)}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:6px}
footer{background:var(--deep);padding:28px 0;font-size:.86rem;color:var(--muted)}
@media (max-width:640px){.wrap{padding:0 16px}body{font-size:16px}.ctas .btn{flex:1 1 auto}}
</style>
</head>
<body>
<header><div class="wrap nav-in"><a class="logo" href="index.html" aria-label="Thread Futures home">thread <span class="b">futures</span></a></div></header>
<main id="main">
  <div class="wrap">
    <span class="eyebrow">Message sent</span>
    <h1>Thanks for <em>getting in touch.</em></h1>
    <p>We've received your message and will reply by email.</p>
    <div class="ctas">
      <a class="btn btn-lime" href="index.html">Back to Thread Futures <span aria-hidden="true">→</span></a>
      <a class="btn btn-ghost" href="index.html#how">See how it works</a>
    </div>
  </div>
</main>
<footer><div class="wrap">© 2026 Thread Futures · London</div></footer>
</body>
</html>
